<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử EVN</title>

https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.jsscript>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

button{
    background:#0066cc;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
}

.question{
    border:1px solid #ddd;
    margin-top:10px;
    padding:10px;
}
</style>

</head>
<body>

<div class="container">

<h1>THI THỬ EVN</h1>

<input type="file" id="file">

<br><br>

<label>Số câu:</label>
<input type="number" id="count" value="20">

<br><br>

<button onclick="startExam()">
Bắt đầu thi
</button>

<hr>

<div id="exam"></div>

</div>

<script>

let bank=[];

document.getElementById("file")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(evt){

const workbook=
XLSX.read(
evt.target.result,
{type:"binary"}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

const rows=
XLSX.utils.sheet_to_json(sheet);

bank=[];

rows.forEach(r=>{

if(!r["Nội dung"]) return;

let options=[];

for(let i=1;i<=12;i++){

let x=
r["Câu trả lời "+i];

if(x) options.push(x);

}

bank.push({

question:r["Nội dung"],

answer:String(
r["Đáp án"]||""
),

options:options

});

});

alert(
"Đã nạp "
+
bank.length
+
" câu hỏi"
);

};

reader.readAsBinaryString(file);

});

function startExam(){

if(bank.length===0){

alert("Excel chưa nạp");

return;

}

document.getElementById(
"exam"
).innerHTML=
"<h2>Đã đọc được "
+
bank.length+
" câu hỏi</h2>";

}

</script>

</body>
</html>
