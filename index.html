<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thi thử</title>
</head>
<body>

<h1>Kiểm tra kết nối Google Sheet</h1>

<button onclick="loadData()">Tải dữ liệu</button>

<pre id="output"></pre>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQO2SebFEqdyhX6gjvWYBB0aUyrAfwsOOok70MN57RdqN7Lrs8j5ZQ5hsoTaOAOKCk4nAKFCm75nH4N/pub?gid=124083215&single=true&output=csv";

async function loadData(){
  const res = await fetch(CSV_URL);
  const txt = await res.text();
  document.getElementById("output").textContent = txt.substring(0,3000);
}
</script>

</body>
</html>
